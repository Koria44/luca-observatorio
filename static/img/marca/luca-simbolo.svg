<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="titulo-simbolo desc-simbolo">
  <title id="titulo-simbolo">Símbolo de Luca</title>
  <desc id="desc-simbolo">Moneda dorada redondeada con una lupa turquesa sonriente en su interior cuyo mango termina en un pin de mapa coral.</desc>
  <!-- Moneda ámbar con borde interior sutil -->
  <circle cx="64" cy="60" r="50" fill="#F5A623" stroke="#12385C" stroke-width="7"/>
  <circle cx="64" cy="60" r="40" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-dasharray="18 8 6 8" opacity="0.75"/>
  <!-- Reflejo mínimo superior izquierdo -->
  <path d="M 33 40 A 35 35 0 0 1 56 26" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Mango de la lupa -->
  <line x1="76" y1="73" x2="90" y2="87" stroke="#12385C" stroke-width="11" stroke-linecap="round"/>
  <line x1="76" y1="73" x2="90" y2="87" stroke="#0F8B8D" stroke-width="5" stroke-linecap="round"/>
  <!-- Pin de ubicación coral en la punta del mango -->
  <path d="M 96 81 C 104 81 110 87 110 95 C 110 105 96 119 96 119 C 96 119 82 105 82 95 C 82 87 88 81 96 81 Z" fill="#E4572E" stroke="#12385C" stroke-width="5.5" stroke-linejoin="round"/>
  <circle cx="96" cy="94" r="4.5" fill="#FFFFFF"/>
  <!-- Aro y cristal de la lupa -->
  <circle cx="59" cy="56" r="24" fill="#FFFFFF" stroke="#0F8B8D" stroke-width="8"/>
  <circle cx="59" cy="56" r="24" fill="none" stroke="#12385C" stroke-width="4"/>
  <!-- Carita sonriente dentro del cristal -->
  <circle cx="51" cy="52" r="3.6" fill="#12385C"/>
  <circle cx="67" cy="52" r="3.6" fill="#12385C"/>
  <path d="M 49 61 Q 59 71 69 61" fill="none" stroke="#12385C" stroke-width="4.2" stroke-linecap="round"/>
</svg>
